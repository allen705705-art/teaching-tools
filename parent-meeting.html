<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ee">
  <title>高二家長會｜匿名互動</title>
  <link rel="stylesheet" href="css/parent-meeting.css">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand">高二家長會<small>陪伴・界線・責任</small></div>
      <div class="status-pill warn" id="connectionStatus" aria-live="polite">
        <span class="status-dot"></span><span>尚未加入</span>
      </div>
    </header>

    <main class="page narrow">
      <section id="joinView" class="card hero-card">
        <p class="eyebrow">家長匿名互動</p>
        <h1 id="appTitle"></h1>
        <p class="lead" id="appSubtitle"></p>
        <div class="quote">情緒可以被接住，但成長的責任要一步一步交還給孩子。</div>
        <p>這個活動不是測驗。請選出最接近自己最直覺反應的答案，再一起看看每種回應可能帶來的影響。</p>

        <div class="field">
          <label for="sessionCodeInput">活動代碼</label>
          <input class="code-input" id="sessionCodeInput" inputmode="text" autocomplete="off" maxlength="6" placeholder="例如 A7K9P2">
        </div>
        <div class="button-row">
          <button class="btn btn-primary btn-large" id="joinButton">匿名加入</button>
        </div>
        <div class="message" id="joinMessage" role="status"></div>
        <p class="privacy-note">本活動不記錄姓名，也不評分。裝置只會取得一組匿名識別碼，用來避免同一題重複計票。</p>
      </section>

      <section id="activityView" class="hidden">
        <div class="session-header">
          <div>
            <div class="progress-label" id="progressLabel">準備中</div>
            <div class="phase-label" id="phaseLabel"></div>
          </div>
          <div class="status-pill">活動代碼 <strong id="activeCode"></strong></div>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <div class="card" id="activityCard" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/parent-meeting-client.js"></script>
</body>
</html>
